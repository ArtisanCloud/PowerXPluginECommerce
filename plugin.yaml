# plugin.yaml 是 PowerX 插件管理器读取的 Manifest，声明插件固定的元信息与能力。
# 生成后请根据实际情况补充描述、数据使用、权限等信息。
id: com.powerx.plugin.ecommerce
name: Powerx Plugin Ecommerce Plugin
version: 0.3.0
description: "Powerx Plugin Ecommerce Plugin 插件描述"
corex_version: ">=0.1.0"
security_baseline_version: "2025.10"

data_usage:
  - purpose: tenant_data_classification
    type: pii_inventory
    retention: 365d
    requires_consent: true

runtime:
  kind: process
  entry: backend/bin/plugin
  env:
    POWERX_BIND_ADDR: ${POWERX_BIND_ADDR:-:8086}
    POWERX_PROXY: "1"
    POWERX_PLUGIN_ID: "com.powerx.plugin.ecommerce"
    POWERX_SECURITY_JWT_ISSUER: "powerx-auth"
    POWERX_SECURITY_JWT_AUDIENCE: "plugin:com.powerx.plugin.ecommerce"
    POWERX_SECURITY_JWT_SECRET: "${POWERX_AUTH_JWTSECRET}"
  health:
    http: /healthz
    interval: 10s
    timeout: 3s

backend:
  entry: backend/bin/plugin
  port: 8086
  health: /healthz

endpoints:
  http_base_path: /api/v1

frontend:
  admin:
    kind: process
    process:
      entry: node
      args: ["./web-admin/.output/server/index.mjs"]
      env:
        NODE_ENV: production
        NITRO_HOST: 127.0.0.1
        POWERX_PROXY: "1"
      health:
        http: /healthz
        interval: 5s
        timeout: 2s
    static_dir: web-admin/.output/public
    i18n:
      dir: web-admin/i18n
      format: i18next
      default_namespace: menus
      namespaces:
        - menus
      locales:
        - zh-CN
        - en
    menus:
      - id: plugins.com.powerx.plugin.ecommerce.channels
        title: 渠道中心
        title_i18n:
          namespace: menus
          key: menu.com.powerx.plugin.ecommerce.channels
          default: Channel Center
        icon: i-heroicons-shopping-bag
        path: /channels
        route: channels
        order: 10
        slot: group.plugins
        required_policies: [com.powerx.plugin.ecommerce:channel.master:read]
        children:
          - id: plugins.com.powerx.plugin.ecommerce.channels.list
            title: 渠道列表
            title_i18n:
              namespace: menus
              key: menu.com.powerx.plugin.ecommerce.channels.list
              default: Channels
            icon: i-heroicons-rectangle-stack
            path: /channels
            route: channels
            order: 1
            required_policies:
              - com.powerx.plugin.ecommerce:channel.master:read
          - id: plugins.com.powerx.plugin.ecommerce.channels.approval
            title: 渠道审批
            title_i18n:
              namespace: menus
              key: menu.com.powerx.plugin.ecommerce.channels.approval
              default: Channel Approvals
            icon: i-heroicons-check-badge
            path: /channels/approval
            route: channels/approval
            order: 2
            required_policies:
              - com.powerx.plugin.ecommerce:channel.master:approve

routes:
  basePath: /api/v1
  adminManifest: /api/v1/admin/manifest
  rbac: /api/v1/admin/rbac

rbac:
  resources:
    - resource: com.powerx.plugin.ecommerce:channel.master
      actions: [read, create, update, approve]
    - resource: com.powerx.plugin.ecommerce:channel.credential
      actions: [read, manage]
    - resource: com.powerx.plugin.ecommerce:channel.alert
      actions: [read, manage]
    - resource: com.powerx.plugin.ecommerce:channel.strategy
      actions: [read, manage]
    - resource: com.powerx.plugin.ecommerce:channel.sync
      actions: [read, trigger]
    - resource: com.powerx.plugin.ecommerce:channel.task
      actions: [read, manage]
    - resource: com.powerx.plugin.ecommerce:channel.note
      actions: [read, create]

permissions:
  - resource: com.powerx.plugin.ecommerce:channel.master
    actions: [read, create, update, approve]
  - resource: com.powerx.plugin.ecommerce:channel.credential
    actions: [read, manage]
  - resource: com.powerx.plugin.ecommerce:channel.alert
    actions: [read, manage]
  - resource: com.powerx.plugin.ecommerce:channel.strategy
    actions: [read, manage]
  - resource: com.powerx.plugin.ecommerce:channel.sync
    actions: [read, trigger]
  - resource: com.powerx.plugin.ecommerce:channel.task
    actions: [read, manage]
  - resource: com.powerx.plugin.ecommerce:channel.note
    actions: [read, create]

agents:
  - id: com.powerx.plugin.ecommerce.assistant
    plugin_id: com.powerx.plugin.ecommerce
    name: Powerx Plugin Ecommerce Plugin 助理
    description: "Powerx Plugin Ecommerce Plugin 内置 Agent"
    default_tools:
      - com.powerx.plugin.ecommerce.template.create

capabilities:
  provides:
    - id: com.powerx.plugin.ecommerce.template.create
      version: 1.0.0
      descriptor: contracts/capabilities/com.powerx.plugin.ecommerce.template.create.yaml
      schemas:
        input: contracts/schema/input/com.powerx.plugin.ecommerce.template.create.json
        output: contracts/schema/output/com.powerx.plugin.ecommerce.template.create.json

agent_tools:
  - id: com.powerx.plugin.ecommerce.template.create
    capability: com.powerx.plugin.ecommerce.template.create
    handler: backend/internal/handlers/capabilities/template/create_handler.go
    description: 创建示例模板

exposure:
  channels:
    - type: rest
      capability: com.powerx.plugin.ecommerce.template.create
      entrypoint: ${POWERX_PLUGIN_HTTP_BASE:-/api/v1}/resources
      method: POST
      auth: jwt
      rbac: com.powerx.plugin.ecommerce:template
    - type: agent_tool
      capability: com.powerx.plugin.ecommerce.template.create
      agent_tool_id: com.powerx.plugin.ecommerce.template.create

# 工具清单侧重声明接口契约，真实业务参数通过 config.yaml 或环境变量注入
tools:
  - id: com.powerx.plugin.ecommerce.template.create
    plugin_id: com.powerx.plugin.ecommerce
    name: 创建示例
    description: 创建示例数据
    transport: http
    endpoint: ${POWERX_PLUGIN_HTTP_BASE:-/api/v1}/resources
    method: POST
    rbac_resource: com.powerx.plugin.ecommerce:template

dependencies:
  requires: []

migrations:
  driver: go
  entry: backend/bin/migrate
  args: ["setup"]
  workdir: ./backend
  once: true
  timeout: 60s

events:
  produces: []

assets:
  public_dir: ./web-admin/public
  webAdminPath: ./web-admin/.output

checksums:
  package_sha256: ""

signature:
  enabled: false

metadata:
  author: Powerx Plugin Ecommerce Plugin Team
  license: MIT
