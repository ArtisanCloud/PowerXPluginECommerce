# plugin.yaml 是 PowerX 插件管理器读取的 Manifest，声明插件固定的元信息与能力。
# 生成后请根据实际情况补充描述、数据使用、权限等信息。
id: com.powerx.plugins.ecommerce
name: Powerx Plugin Ecommerce Plugin
version: 0.3.0
description: "Powerx Plugin Ecommerce Plugin 插件描述"
corex_version: ">=0.1.0"
security_baseline_version: "2025.10"

data_usage:
  - purpose: tenant_data_classification
    type: pii_inventory
    retention: 365d
    requires_consent: true

runtime:
  kind: process
  entry: backend/bin/plugin
  env:
    POWERX_BIND_ADDR: ":__POWERX_DYNAMIC_PORT__"
    POWERX_PLUGIN_REGISTRATION_MODE: installed
    POWERX_PROVIDER_MODE: delegated
    POWERX_PROXY: "1"
    POWERX_PLUGIN_ID: "com.powerx.plugins.ecommerce"
    POWERX_SECURITY_JWT_ISSUER: "powerx-auth"
    POWERX_SECURITY_JWT_AUDIENCE: "plugin:com.powerx.plugins.ecommerce"
    POWERX_SECURITY_JWT_SECRET: "${POWERX_AUTH_JWTSECRET}"
  health:
    http: /healthz
    interval: 10s
    timeout: 3s

backend:
  entry: backend/bin/plugin
  port: 0
  health: /healthz

endpoints:
  http_base_path: /api/v1

catalogs:
  capabilities: ./plugin.d/capabilities.yaml
  exposure: ./plugin.d/exposure.yaml
  agent_tools: ./plugin.d/agent_tools.yaml
  events: ./plugin.d/events.yaml
  rbac: ./plugin.d/rbac.yaml

frontend:
  admin:
    kind: process
    process:
      entry: node
      args: ["./web-admin/.output/server/index.mjs"]
      env:
        NODE_ENV: production
        NITRO_HOST: 127.0.0.1
        POWERX_PROVIDER_MODE: delegated
        NUXT_PUBLIC_POWERX_PROVIDER_MODE: delegated
        POWERX_PROXY: "1"
        NUXT_PUBLIC_POWERX_PROXY: "1"
      health:
        http: /healthz
        interval: 5s
        timeout: 2s
    static_dir: web-admin/.output/public
    i18n:
      dir: web-admin/i18n
      format: i18next
      default_namespace: menus
      namespaces:
        - menus
      locales:
        - zh-CN
        - en
    menus:
      - id: plugins.com.powerx.plugins.ecommerce
        title: 电商中台
        title_i18n:
          namespace: menus
          key: menu.com.powerx.plugins.ecommerce.console
          default: Ecommerce Console
        icon: i-heroicons-clipboard-document-check
        path: /dashboard
        route: dashboard
        order: 20
        slot: group.plugins
        children:
          - id: plugins.com.powerx.plugins.ecommerce.products
            title: 商品中心
            title_i18n:
              namespace: menus
              key: menu.com.powerx.plugins.ecommerce.productCenter
              default: Product Center
            icon: i-heroicons-archive-box
            path: /product
            route: product
            order: 1
            required_policies:
              - com.powerx.plugins.ecommerce:product.sku:read
            children:
              - id: plugins.com.powerx.plugins.ecommerce.products.skus
                title: SKU 管理
                title_i18n:
                  namespace: menus
                  key: menu.com.powerx.plugins.ecommerce.skuManagement
                  default: SKU Management
                icon: i-heroicons-squares-2x2
                path: /product/skus
                route: product/skus
                order: 1
                required_policies:
                  - com.powerx.plugins.ecommerce:product.sku:read
              - id: plugins.com.powerx.plugins.ecommerce.products.spus
                title: SPU 管理
                title_i18n:
                  namespace: menus
                  key: menu.com.powerx.plugins.ecommerce.spuManagement
                  default: SPU Management
                icon: i-heroicons-cube
                path: /product/spus
                route: product/spus
                order: 2
                required_policies:
                  - com.powerx.plugins.ecommerce:product.sku:read
              - id: plugins.com.powerx.plugins.ecommerce.products.categories
                title: 分类管理
                title_i18n:
                  namespace: menus
                  key: menu.com.powerx.plugins.ecommerce.categories
                  default: Categories
                icon: i-heroicons-folder
                path: /product/categories
                route: product/categories
                order: 3
                required_policies:
                  - com.powerx.plugins.ecommerce:product.category:read
                  - com.powerx.plugins.ecommerce:product.category.sale_spec:read
              - id: plugins.com.powerx.plugins.ecommerce.products.category_templates
                title: 分类模板
                title_i18n:
                  namespace: menus
                  key: menu.com.powerx.plugins.ecommerce.categoryTemplates
                  default: Category Templates
                icon: i-heroicons-document-duplicate
                path: /product/category-templates
                route: product/category-templates
                order: 4
                required_policies:
                  - com.powerx.plugins.ecommerce:product.category.template:read
              - id: plugins.com.powerx.plugins.ecommerce.products.inventory
                title: 库存与变体
                title_i18n:
                  namespace: menus
                  key: menu.com.powerx.plugins.ecommerce.inventory
                  default: Inventory & Variants
                icon: i-heroicons-chart-bar-square
                path: /product/inventory
                route: product/inventory
                order: 5
                required_policies:
                  - com.powerx.plugins.ecommerce:product.sku.inventory:read
                  - com.powerx.plugins.ecommerce:product.sku.channel:manage
          - id: plugins.com.powerx.plugins.ecommerce.customers
            title: 客户中心
            title_i18n:
              namespace: menus
              key: menu.com.powerx.plugins.ecommerce.customerCenter
              default: Customer Center
            icon: i-heroicons-user-group
            path: /customer
            route: customer
            order: 2
            required_policies:
              - customer.read:read
            children:
              - id: plugins.com.powerx.plugins.ecommerce.customers.list
                title: 客户列表
                title_i18n:
                  namespace: menus
                  key: menu.com.powerx.plugins.ecommerce.customerList
                  default: Customers
                icon: i-heroicons-users
                path: /customer
                route: customer
                order: 1
                required_policies:
                  - customer.read:read
              - id: plugins.com.powerx.plugins.ecommerce.customers.members
                title: 会员管理
                title_i18n:
                  namespace: menus
                  key: menu.com.powerx.plugins.ecommerce.members
                  default: Members
                icon: i-heroicons-identification
                path: /customer/members
                route: customer/members
                order: 2
                required_policies:
                  - com.powerx.plugins.ecommerce:membership:read
              - id: plugins.com.powerx.plugins.ecommerce.customers.membership
                title: 会员权益
                title_i18n:
                  namespace: menus
                  key: menu.com.powerx.plugins.ecommerce.membershipBenefits
                  default: Membership Benefits
                icon: i-heroicons-sparkles
                path: /customer/membership
                route: customer/membership
                order: 3
                required_policies:
                  - com.powerx.plugins.ecommerce:membership:read
          - id: plugins.com.powerx.plugins.ecommerce.channels
            title: 渠道中心
            title_i18n:
              namespace: menus
              key: menu.com.powerx.plugins.ecommerce.channelCenter
              default: Channel Center
            icon: i-heroicons-shopping-bag
            path: /channels
            route: channels
            order: 3
            required_policies:
              - com.powerx.plugins.ecommerce:channel.master:read
            children:
              - id: plugins.com.powerx.plugins.ecommerce.channels.list
                title: 渠道列表
                title_i18n:
                  namespace: menus
                  key: menu.com.powerx.plugins.ecommerce.channelList
                  default: Channels
                icon: i-heroicons-rectangle-stack
                path: /channels
                route: channels
                order: 1
                required_policies:
                  - com.powerx.plugins.ecommerce:channel.master:read
              - id: plugins.com.powerx.plugins.ecommerce.channels.approval
                title: 渠道审批
                title_i18n:
                  namespace: menus
                  key: menu.com.powerx.plugins.ecommerce.channelApprovals
                  default: Channel Approvals
                icon: i-heroicons-check-badge
                path: /channels/approval
                route: channels/approval
                order: 2
                required_policies:
                  - com.powerx.plugins.ecommerce:channel.master:approve
          - id: plugins.com.powerx.plugins.ecommerce.pricing
            title: 价格与促销
            title_i18n:
              namespace: menus
              key: menu.com.powerx.plugins.ecommerce.pricingPromotions
              default: Pricing & Promotions
            icon: i-heroicons-banknotes
            path: /pricing
            route: pricing
            order: 4
            required_policies:
              - com.powerx.plugins.ecommerce:pricing.pricebook:read
              - com.powerx.plugins.ecommerce:pricing.coupon.template:read
            children:
              - id: plugins.com.powerx.plugins.ecommerce.pricing.pricebooks
                title: 价格手册
                title_i18n:
                  namespace: menus
                  key: menu.com.powerx.plugins.ecommerce.pricebooks
                  default: Pricebooks
                icon: i-heroicons-book-open
                path: /pricing/pricebooks
                route: pricing/pricebooks
                order: 1
                required_policies:
                  - com.powerx.plugins.ecommerce:pricing.pricebook:read
              - id: plugins.com.powerx.plugins.ecommerce.pricing.coupons
                title: 优惠券模板
                title_i18n:
                  namespace: menus
                  key: menu.com.powerx.plugins.ecommerce.couponTemplates
                  default: Coupon Templates
                icon: i-heroicons-ticket
                path: /pricing/coupons
                route: pricing/coupons
                order: 2
                required_policies:
                  - com.powerx.plugins.ecommerce:pricing.coupon.template:read
              - id: plugins.com.powerx.plugins.ecommerce.pricing.coupon_usages
                title: 发券与使用记录
                title_i18n:
                  namespace: menus
                  key: menu.com.powerx.plugins.ecommerce.couponUsages
                  default: Coupon Assets & Usage
                icon: i-heroicons-clipboard-document-list
                path: /pricing/coupon-usages
                route: pricing/coupon-usages
                order: 3
                required_policies:
                  - com.powerx.plugins.ecommerce:pricing.coupon.usage:read
              - id: plugins.com.powerx.plugins.ecommerce.pricing.promotions
                title: 促销规则
                title_i18n:
                  namespace: menus
                  key: menu.com.powerx.plugins.ecommerce.promotionRules
                  default: Promotion Rules
                icon: i-heroicons-sparkles
                path: /pricing/promotions
                route: pricing/promotions
                order: 4
                required_policies:
                  - com.powerx.plugins.ecommerce:pricing.promotion:read
          - id: plugins.com.powerx.plugins.ecommerce.orders
            title: 订单中心
            title_i18n:
              namespace: menus
              key: menu.com.powerx.plugins.ecommerce.orderCenter
              default: Order Center
            icon: i-heroicons-shopping-cart
            path: /market/orders
            route: market/orders
            order: 5
            required_policies:
              - com.powerx.plugins.ecommerce:order:read
            children:
              - id: plugins.com.powerx.plugins.ecommerce.orders.list
                title: 订单列表
                title_i18n:
                  namespace: menus
                  key: menu.com.powerx.plugins.ecommerce.orderList
                  default: Orders
                icon: i-heroicons-list-bullet
                path: /market/orders
                route: market/orders
                order: 1
                required_policies:
                  - com.powerx.plugins.ecommerce:order:read
          - id: plugins.com.powerx.plugins.ecommerce.payments
            title: 支付中心
            title_i18n:
              namespace: menus
              key: menu.com.powerx.plugins.ecommerce.paymentCenter
              default: Payments
            icon: i-heroicons-credit-card
            path: /payments/providers
            route: payments/providers
            order: 6
            required_policies:
              - com.powerx.plugins.ecommerce:payments:read
            children:
              - id: plugins.com.powerx.plugins.ecommerce.payments.providers
                title: 支付渠道
                title_i18n:
                  namespace: menus
                  key: menu.com.powerx.plugins.ecommerce.paymentProviders
                  default: Payment Providers
                icon: i-heroicons-building-library
                path: /payments/providers
                route: payments/providers
                order: 1
                required_policies:
                  - com.powerx.plugins.ecommerce:payments:read
          - id: plugins.com.powerx.plugins.ecommerce.after_sales
            title: 售后中心
            title_i18n:
              namespace: menus
              key: menu.com.powerx.plugins.ecommerce.afterSalesCenter
              default: After-sales
            icon: i-heroicons-arrow-path-rounded-square
            path: /market/after-sales
            route: market/after-sales
            order: 7
            required_policies:
              - com.powerx.plugins.ecommerce:after_sales.dashboard:read
            children:
              - id: plugins.com.powerx.plugins.ecommerce.after_sales.workbench
                title: 售后工作台
                title_i18n:
                  namespace: menus
                  key: menu.com.powerx.plugins.ecommerce.afterSalesWorkbench
                  default: After-sales Workbench
                icon: i-heroicons-wrench-screwdriver
                path: /market/after-sales
                route: market/after-sales
                order: 1
                required_policies:
                  - com.powerx.plugins.ecommerce:after_sales.dashboard:read

# 工具清单侧重声明接口契约，真实业务参数通过 config.yaml 或环境变量注入
tools:
  - id: com.powerx.plugins.ecommerce.template.create
    plugin_id: com.powerx.plugins.ecommerce
    name: 创建示例
    description: 创建示例数据
    transport: http
    endpoint: ${POWERX_PLUGIN_HTTP_BASE:-/api/v1}/resources
    method: POST
    rbac_resource: com.powerx.plugins.ecommerce:template

dependencies:
  requires: []

migrations:
  driver: go
  entry: backend/bin/migrate
  args: ["setup"]
  workdir: ./backend
  once: true
  timeout: 60s

assets:
  public_dir: ./web-admin/public
  webAdminPath: ./web-admin/.output

checksums:
  package_sha256: ""

signature:
  enabled: false

metadata:
  author: Powerx Plugin Ecommerce Plugin Team
  icon: icon.svg
  license: MIT
