routes:
  adminManifest: /api/v1/admin/manifest
  basePath: /api/v1
  permissions:
    - method: GET
      path: /admin/after-sales/cases
      permission:
        action: read
        resource: com.powerx.plugins.ecommerce:after_sales.case
    - method: GET
      path: /admin/after-sales/cases/:id
      permission:
        action: read
        resource: com.powerx.plugins.ecommerce:after_sales.case
    - method: POST
      path: /admin/after-sales/cases/:id/accept
      permission:
        action: manage
        resource: com.powerx.plugins.ecommerce:after_sales.case
    - method: POST
      path: /admin/after-sales/cases/:id/approve
      permission:
        action: manage
        resource: com.powerx.plugins.ecommerce:after_sales.case
    - method: POST
      path: /admin/after-sales/cases/:id/close
      permission:
        action: manage
        resource: com.powerx.plugins.ecommerce:after_sales.case
    - method: POST
      path: /admin/after-sales/cases/:id/complete
      permission:
        action: manage
        resource: com.powerx.plugins.ecommerce:after_sales.case
    - method: POST
      path: /admin/after-sales/cases/:id/reject
      permission:
        action: manage
        resource: com.powerx.plugins.ecommerce:after_sales.case
    - method: POST
      path: /admin/after-sales/cases/:id/reverse-logistics
      permission:
        action: manage
        resource: com.powerx.plugins.ecommerce:after_sales.reverse_link
    - method: POST
      path: /admin/after-sales/cases/:id/review
      permission:
        action: manage
        resource: com.powerx.plugins.ecommerce:after_sales.case
    - method: GET
      path: /admin/after-sales/dashboard
      permission:
        action: read
        resource: com.powerx.plugins.ecommerce:after_sales.dashboard
    - method: GET
      path: /admin/capabilities
      permission:
        action: read
        resource: capability.management
    - method: GET
      path: /admin/capabilities/exposure/:capabilityID
      permission:
        action: read
        resource: capability.management
    - method: PUT
      path: /admin/capabilities/exposure/:capabilityID
      permission:
        action: write
        resource: capability.management
    - method: GET
      path: /admin/capabilities/exposure/template
      permission:
        action: read
        resource: capability.management
    - method: GET
      path: /admin/capabilities/lifecycle
      permission:
        action: read
        resource: capability.management
    - method: POST
      path: /admin/capabilities/lifecycle
      permission:
        action: write
        resource: capability.management
    - method: POST
      path: /admin/capabilities/lifecycle/:planID/status
      permission:
        action: manage
        resource: capability.management
    - method: GET
      path: /admin/capabilities/lifecycle/template
      permission:
        action: read
