name: CI

on:
  push:
    branches:
      - main
      - develop
      - "release/**"
  pull_request:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 本次构建预期使用的完整 Git SHA
        required: true
        type: string
      plugin_version:
        description: 插件包版本
        required: true
        type: string
      request_id:
        description: 构建请求标识（可选）
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: powerx_plugin_test
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/powerx_plugin_test?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web-admin/package-lock.json

      - name: Install frontend dependencies
        working-directory: web-admin
        run: npm ci

      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8

      - name: Run CI pipeline
        run: make ci-all

  package:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    permissions:
      contents: read
    uses: ArtisanCloud/PowerXPlugin/.github/workflows/reusable-plugin-ci.yml@10f67261d9d3f699a59ed7175ef3a793bdee7a31
    with:
      source_sha: ${{ inputs.source_sha }}
      plugin_version: ${{ inputs.plugin_version }}
      mode: build
      request_id: ${{ inputs.request_id || format('github-{0}', github.run_id) }}
