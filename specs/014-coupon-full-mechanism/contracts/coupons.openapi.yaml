openapi: 3.0.3
info:
  title: PowerX Plugin - Coupon Full Mechanism API
  version: 0.1.0
paths:
  /v1/coupons/quote:
    post:
      summary: Quote coupon discount for an order draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CouponQuoteRequest'
      responses:
        '200':
          description: Quote result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponQuoteResponse'
  /api/v1/admin/coupons/templates:
    get:
      summary: List coupon templates
      responses:
        '200':
          description: Template list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateListResponse'
    post:
      summary: Create coupon template
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CouponTemplateCreateRequest'
      responses:
        '200':
          description: Created template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponTemplate'
  /api/v1/admin/coupons/templates/{templateId}:
    patch:
      summary: Update coupon template
      parameters:
        - in: path
          name: templateId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CouponTemplateUpdateRequest'
      responses:
        '200':
          description: Updated template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponTemplate'
  /api/v1/admin/coupons/issue:
    post:
      summary: Issue coupons to users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CouponIssueRequest'
      responses:
        '200':
          description: Issue summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponIssueResponse'
  /api/v1/admin/coupons/assets:
    get:
      summary: List coupon assets
      parameters:
        - in: query
          name: user_id
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [available, reserved, redeemed, refunded, expired]
      responses:
        '200':
          description: Asset list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponAssetListResponse'
  /api/v1/admin/coupons/usages:
    get:
      summary: List coupon usage logs
      parameters:
        - in: query
          name: order_id
          schema:
            type: string
        - in: query
          name: coupon_code
          schema:
            type: string
      responses:
        '200':
          description: Usage logs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponUsageListResponse'
components:
  schemas:
    Money:
      type: object
      properties:
        amount_minor:
          type: integer
          format: int64
        currency:
          type: string
      required: [amount_minor, currency]

    QuoteItem:
      type: object
      properties:
        sku_id:
          type: string
        qty:
          type: integer
        unit_price_minor:
          type: integer
          format: int64
      required: [sku_id, qty, unit_price_minor]

    CouponQuoteRequest:
      type: object
      properties:
        user_id:
          type: string
        channel:
          type: string
        coupon_ids:
          type: array
          items:
            type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/QuoteItem'
      required: [user_id, channel, items]

    AppliedCoupon:
      type: object
      properties:
        coupon_id:
          type: string
        coupon_code:
          type: string
        discount_minor:
          type: integer
          format: int64
        level:
          type: string
          enum: [item, order]
      required: [coupon_id, coupon_code, discount_minor, level]

    RejectedCoupon:
      type: object
      properties:
        coupon_id:
          type: string
        reason:
          type: string
      required: [coupon_id, reason]

    CouponQuoteResponse:
      type: object
      properties:
        base_total:
          $ref: '#/components/schemas/Money'
        discount_total:
          $ref: '#/components/schemas/Money'
        payable_total:
          $ref: '#/components/schemas/Money'
        applied_coupons:
          type: array
          items:
            $ref: '#/components/schemas/AppliedCoupon'
        rejected_coupons:
          type: array
          items:
            $ref: '#/components/schemas/RejectedCoupon'
      required: [base_total, discount_total, payable_total, applied_coupons, rejected_coupons]

    CouponTemplate:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
        coupon_type:
          type: string
          enum: [amount, percent]
        status:
          type: string
          enum: [draft, active, inactive]
        priority:
          type: integer
        stackable:
          type: boolean
        exclusion_group:
          type: string
          nullable: true
      required: [id, code, name, coupon_type, status, priority, stackable]

    CouponTemplateCreateRequest:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        coupon_type:
          type: string
          enum: [amount, percent]
        priority:
          type: integer
        stackable:
          type: boolean
        exclusion_group:
          type: string
          nullable: true
        threshold_rule:
          type: object
          additionalProperties: true
        scope_rule:
          type: object
          additionalProperties: true
        refund_rule:
          type: object
          additionalProperties: true
      required: [code, name, coupon_type, priority, stackable]

    CouponTemplateUpdateRequest:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
          enum: [draft, active, inactive]
        priority:
          type: integer
        stackable:
          type: boolean
        exclusion_group:
          type: string
          nullable: true
        threshold_rule:
          type: object
          additionalProperties: true
        scope_rule:
          type: object
          additionalProperties: true
        refund_rule:
          type: object
          additionalProperties: true

    TemplateListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CouponTemplate'
      required: [items]

    CouponIssueRequest:
      type: object
      properties:
        template_id:
          type: string
        user_ids:
          type: array
          items:
            type: string
        quantity_per_user:
          type: integer
      required: [template_id, user_ids, quantity_per_user]

    CouponIssueResponse:
      type: object
      properties:
        issued_count:
          type: integer
        skipped_count:
          type: integer
      required: [issued_count, skipped_count]

    CouponAsset:
      type: object
      properties:
        id:
          type: string
        coupon_code:
          type: string
        user_id:
          type: string
        status:
          type: string
          enum: [available, reserved, redeemed, refunded, expired]
        reserved_order_id:
          type: string
          nullable: true
      required: [id, coupon_code, user_id, status]

    CouponAssetListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CouponAsset'
      required: [items]

    CouponUsageLog:
      type: object
      properties:
        id:
          type: string
        asset_id:
          type: string
        order_id:
          type: string
          nullable: true
        action:
          type: string
          enum: [reserve, release, redeem, refund]
        reason:
          type: string
      required: [id, asset_id, action]

    CouponUsageListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CouponUsageLog'
      required: [items]
