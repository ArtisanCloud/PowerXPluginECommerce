# Skeleton 插件示例配置
# 将本文件复制为 backend/etc/config.yaml 即可覆盖默认配置。
#
# Auth / IAM 相关环境变量速查（未在 YAML 中硬编码，以免泄露敏感信息）：
#   POWERX_CORE_ENDPOINT      - Delegated 模式访问宿主 Core API 的基址（默认 http://localhost:8077）
#   PX_GATEWAY_BASE_URL       - Gateway 基址（不带 API 前缀，例如 http://localhost:8077）
#   PX_GATEWAY_API_PREFIX     - Gateway API 前缀（默认 /api/v1）
#   PX_GATEWAY_AUTH_SCHEME    - Gateway 鉴权方案：bearer / apikey
#   PX_GATEWAY_API_KEY        - ApiKey 鉴权凭证（当 PX_GATEWAY_AUTH_SCHEME=apikey）
#   POWERX_STS_CLIENT_ID      - STS client_id（格式建议 <plugin_id>.<tenant_uuid>）
#   POWERX_STS_CLIENT_SECRET  - STS client_secret
#   POWERX_STS_AUDIENCE       - STS audience（默认 powerx:api）
#   POWERX_STS_SCOPE          - STS scope（默认 access）
#   PX_GATEWAY_TIMEOUT        - Gateway 调用超时（支持 duration 或秒数，默认 60s）
#   POWERX_AUTH_TOKEN         - Root/Admin 本地调试 Token；宿主业务链路不得依赖
#   IAM_MODE / POWERX_IAM_MODE - IAM 模式（local / delegated）
#   PLUGIN_IAM_ADMIN_EMAIL    - Local 模式默认管理员邮箱（用于 migrate/seed）
#   PLUGIN_IAM_ADMIN_PASSWORD - Local 模式默认管理员密码（用于 migrate/seed）

server:
  bind_addr: ":8078"
  api_prefix: "/api/v1"
  log_level: "debug"
  dev_mode: true

# gRPC 上游（可选，默认关闭）
grpc_upstream:
  address: "localhost:8079"
  # tenant_uuid 建议由 POWERX_GRPC_UPSTREAM_TENANT_UUID 或 STS client_id 对应租户提供。
  tenant_uuid: "00000000-0000-0000-0000-000000000001"
  use_tls: false
  sts_client_id: ""
  sts_client_secret: ""
  sts_audience: "powerx:api"
  sts_scope: "access"
  sts_ttl: 300s
  connect_mode: "lazy"
  optional: true

database:
  # driver 可选 memory / sqlite / postgres。缺省值为 memory（内存 SQLite）。
  driver: "sqlite"
  dsn: "file:../../.cache/powerxplugin.db?cache=shared&_fk=1"
  schema: ""
  maxIdleConns: 10
  maxOpenConns: 100
  connMaxLifetime: 1h
  connMaxIdleTime: 30m
  slowThreshold: 200ms
  preferSimpleProtocol: true
  prepareStmt: false
  skipDefaultTx: false
  logLevel: "silent"
  devMode: false
  healthTimeout: 5s

runtime:
  run_migrate: false
  drivers:
    websocket: auto
    event_topic: auto
    task: auto
    cache: auto

runtime_ops:
  heartbeat_seconds: 15
  heartbeat_misses: 3
  quota_window_minutes: 5
  restart_backoff_start_seconds: 5
  restart_backoff_max_seconds: 120
  log_retention_days: 7
  cpu_default: "500m"
  memory_default: "512Mi"
  network_profile: "standard"
  observability:
    loki_endpoint: ""
    tempo_endpoint: ""
  alerts:
    health_failure_rate: 0.5
    p95_latency_ms: 500
    error_rate: 0.05
    quota_usage: 0.9
    billing_anomaly: 0.2

context:
  hmac_secret: "dev-hmac-secret"
  key_id: "dev"
  jwks_url: ""
  issuer: ""
  audience: ""
  # IAM 模式解析优先级：context.iam_mode > POWERX_PROXY
  # 可选值：local / delegated；留空表示 auto（按环境推断）
  iam_mode: ""
  ttl: "5m"

host:
  web_admin_origins:
    - "http://localhost:3030"
    - "http://127.0.0.1:3030"

customer_auth:
  mode: "local" # local / delegate / auto
  delegate_endpoint: "https://core.powerx.dev/api/v1/customer/auth/validate"
  service_token: "" # 默认为 POWERX_AUTH_TOKEN
  jwt_secret: "dev-miniapp-secret"
  jwt_issuer: "powerx-plugin-customer"
  jwt_audience: "mini-app"
  jwt_expires: "2h"
  cache_ttl: "5m"

wechat_miniapp:
  app_id: "wxc1ebbc8236ffae2b"
  app_secret: "replace-with-secret"
  http_debug: false
  debug: false

security:
  enable_cors: true
  cors_origins:
    - "http://localhost:3031"
    - "http://127.0.0.1:3031"
  rate_limit:
    enabled: false

monitoring:
  metrics:
    enabled: true
    path: "/api/v1/admin/runtime/metrics"
  health_check:
    enabled: true
    path: "/healthz"

logging:
  level: "debug"
  format: "text"
  output: "stdout"
  payment_callback_notify_debug: false
  wechat_http_debug: false

integration:
  idempotency:
    provider: redis
    redis_url: "redis://localhost:6379"
    ttl_hours: 24
  envelope:
    payload_threshold_bytes: 1048576
  webhook:
    retry_policy: [60, 300, 900]
    dlq_topic: "plugin.webhook.dlq"
  secrets:
    rotation_days_default: 30
  billing:
    tax_provider: stripe_tax
    stripe_tax:
      api_key: "sk_test_xxx"
      account_id: ""
      location: "US"
      api_base_url: "https://api.stripe.com"
      webhook_secret: ""
      timeout_seconds: 15
    avalara:
      account_id: ""
      license_key: ""
      company_code: ""
      environment: "sandbox"
      base_url: "https://sandbox-rest.avatax.com"
      client_id: ""
      client_secret: ""
      timeout_seconds: 15
    reconciliation:
      vendor_share: 0.8
      platform_share: 0.15
      fee_share: 0.05
      currency: "USD"
    async_queue: "marketplace.billing.async"
    http_timeout_seconds: 15
    retry_backoff_seconds: [5, 30, 120]

marketplace:
  checklist:
    graphql_path: "/api/v1/admin/marketplace/checklist/graphql"
    docs_url: "specs/006-marketplace-business/contracts/ready-checklist.graphql"
  documentation:
    overview: "specs/006-marketplace-business/quickstart.md"
    ready_checklist: "specs/006-marketplace-business/contracts/ready-checklist.graphql"
    listing_playbook: "specs/006-marketplace-business/spec.md"
  recommendation:
    enabled: false
    default_weight: 0.0
    experiment_topic: "marketplace.recommendation.experiments"
    frequency_minutes: 60
  license:
    offline_allowance_hours: 72
    cache:
      provider: redis
      redis_url: "redis://localhost:6379"
      key_prefix: "powerx:marketplace:licenses"
    reminder:
      lead_hours: 0
      channels: []

operations:
  support:
    webhook_secret: "replace-me"
    default_channels:
      - channel: "marketplace_ticket"
        address: "https://support.powerx.dev/plugins/base"
        escalates: ["agent", "engineer"]
      - channel: "vendor_email"
        address: "vendor-support@example.com"
        escalates: ["agent", "manager"]
      - channel: "emergency_hotline"
        address: "+1-800-555-0100"
        escalates: ["manager"]
  incident:
    status_page_url: "https://status.powerx.dev/plugins/base"
    security_contacts: ["security@powerx.io"]
    communication_modes: ["support_hub", "status_page", "security_email", "hotline"]
  sla:
    timezone: "UTC"
    daily_cron: "0 5 * * *"

# 如需切换到 Postgres，可以将 driver 设置为 postgres 并提供 dsn，例如：
# database:
#   driver: "postgres"
#   dsn: "postgres://powerx:powerx@localhost:5432/powerx?sslmode=disable"
#   schema: "px_plugin_base"
